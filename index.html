<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byteverse Lv.21</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        .interaction-prompt{
    display:none;
    position:absolute;
    bottom:20%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px 20px;
    border-radius:8px;
    font-family:'Segoe UI',sans-serif;
    font-weight:bold;
    pointer-events:none;
    z-index:100;
}
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            color: #fef08a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        #overlay span { font-size: 1rem; color: #cbd5e1; margin-top: 10px; font-weight: normal; }

        #door-prompt {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 1.1rem;
            border: 1px solid #f59e0b;
            display: none;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        #music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, background 0.2s;
        }
        #music-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.4); }
        #dialogue-box{
    position: absolute;

    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);

    width: calc(100% - 120px);   /* 40px margin on each side */
    max-width: 900px;

    min-height: 3px;
    padding: 25px 35px;

    background: rgba(248,244,233,0.98);

    border: 4px solid #6f4e37;
    border-radius: 16px;

    display: none;
    z-index: 100;

    box-shadow: 0 12px 35px rgba(0,0,0,.35);
}

#dialogue-speaker{

    font-size:30px;
    margin-bottom:15px;

}

#dialogue-text{

    color:#33251a;

    font-size:20px;

    line-height:1.2;

    min-height:55px;

    white-space:pre-line;

    font-family:Georgia,serif;

}

#dialogue-next{

    float:right;

    margin-top:10px;

    padding:12px 30px;

    border:none;

    border-radius:10px;

    background:#8b5e3c;

    color:white;

    cursor:pointer;

    font-size:17px;
    
    transition: .2s;

}

#dialogue-next:hover{

    background:#6d472d;

}
    </style>
</head>
<body>
    <div id="overlay">
        Click Anywhere to Start!
        <span>Press W, A, S, D to walk around</span>
    </div>
    <div id="dialogue-box">
    <div id="dialogue-speaker">🐔</div>

    <div id="dialogue-text"></div>

    <button id="dialogue-next">Enter ▶</button>
</div>
   <div id="door-prompt">
    Press <b>E</b> or <b>ENTER</b> to Open Door<br>
    Press <b>Q</b> to Close Door
</div>
    <div id="music-btn">🎧</div>

    <!-- HTML Audio element for reliable music playback -->
    <audio id="bg-audio" loop src="assets/music/bgm.mp3"></audio>

    <script type="module" src="script.js"></script>
    <!-- Add this inside <body> in index.html -->
<div id="sit-prompt" class="interaction-prompt">
    Press <b>F</b> to Sit
</div>

<div id="flower-prompt" class="interaction-prompt">
    Press <b>P</b> to Pick Flower
</div>
<div id="chicken-prompt" class="interaction-prompt">
    Press <b>C</b> to Talk to Chicken
</div>
</body>
</html>
